[package]
name = "mqtt-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
mqtt-egress-core = { path = "../mqtt-egress-core" }
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
krafka = { version = "=0.28.1", default-features = false, features = ["ring", "zstd", "tls-encrypted-keys", "native-tls-roots"] }
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
pkcs8 = { version = "0.10", default-features = false, features = ["std", "encryption", "pem"] }
[dev-dependencies]
krafka = { version = "=0.28.1", default-features = false, features = ["ring", "zstd", "tls-encrypted-keys", "native-tls-roots", "test-broker"] }
