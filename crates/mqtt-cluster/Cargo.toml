[package]
name = "mqtt-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
mqtt-cluster-core = { path = "../mqtt-cluster-core" }
mqtt-router = { path = "../mqtt-router" }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
tonic = { version = "=0.14.2", features = ["transport", "tls-ring"] }
tonic-prost = "=0.14.2"
prost = "=0.14.3"
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
getrandom = "0.2"
[build-dependencies]
tonic-prost-build = "=0.14.2"
