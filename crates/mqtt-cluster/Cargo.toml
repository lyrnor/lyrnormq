[package]
name = "mqtt-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
mqtt-cluster-core = { path = "../mqtt-cluster-core" }
mqtt-router = { path = "../mqtt-router" }
openraft = { version = "=0.10.0-alpha.37", features = ["serde"] }
openraft-legacy = { version = "=0.10.0-alpha.37", features = ["serde"] }
tonic = { version = "=0.14.2", features = ["transport", "tls-ring"] }
tonic-prost = "=0.14.2"
prost = "=0.14.3"
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bbolt = { git = "https://github.com/biaogd/bbolt-rs", tag = "v0.1.1", default-features = false }
raft-log = "=0.4.6"
getrandom = { version = "0.2", features = ["std"] }
sha2 = "0.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }
[build-dependencies]
tonic-prost-build = "=0.14.2"
