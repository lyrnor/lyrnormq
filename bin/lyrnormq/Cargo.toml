[package]
name = "lyrnormq"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
mqtt-cluster = { path = "../../crates/mqtt-cluster" }
mqtt-auth-http = { path = "../../crates/mqtt-auth-http", default-features = false }
base64 = "0.22"
mqtt-rules = { path = "../../crates/mqtt-rules" }
mqtt-egress = { path = "../../crates/mqtt-egress" }
mqtt-auth = { path = "../../crates/mqtt-auth" }
mqtt-transport = { path = "../../crates/mqtt-transport" }
tokio.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std", "tracing-log"] }
tracing-appender = { version = "0.2", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
serde_urlencoded = "0.7"
same-file = "1.0"
include_dir = { version = "0.7.4", default-features = false }
mimalloc = { version = "0.1", default-features = false }

[features]
default = ["postgres-auth", "redis-auth"]
postgres-auth = ["mqtt-auth-http/postgres-auth"]
redis-auth = ["mqtt-auth-http/redis-auth"]
