name: Rust and MQTT checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Build React assets required by the embedded Broker
        working-directory: dashboard/web
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install cluster RPC code generator
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Embedded Dashboard build-input guards
        run: |
          rustc --edition=2024 --test bin/lyrnormq/build.rs -o /tmp/lyrnormq-embedded-build-tests
          /tmp/lyrnormq-embedded-build-tests
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo fmt --manifest-path fuzz/libfuzzer/Cargo.toml -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path fuzz/Cargo.toml
      - run: cargo build --workspace
      - run: python3 tests/check_conformance_matrix.py
      - run: python3 tests/acceptance_guard_negative.py
      - run: python3 benches/phase3/test_driver.py
      - run: python3 benches/phase3/test_diagnostics.py
      - run: python3 benches/phase3/connections.py --binary target/debug/lyrnormq --output /tmp/lyrnormq-connections-memory.json --smoke
      - run: python3 benches/phase3/connections.py --binary target/debug/lyrnormq --output /tmp/lyrnormq-connections-sqlite.json --smoke --storage sqlite --session-expiry 60
      - name: Independent TLS and MQTT wire acceptance
        run: |
          openssl version
          python3 tests/tls_blackbox.py
      - run: python3 tests/websocket_blackbox.py
      - run: python3 tests/admission_mtls_blackbox.py
      - run: python3 tests/blackbox.py
      - run: python3 tests/qos_blackbox.py
      - run: python3 tests/persistence_blackbox.py
      - run: python3 tests/retained_will_blackbox.py
      - run: python3 tests/auth_acl_blackbox.py
      - run: python3 tests/mqtt5_blackbox.py
      - run: python3 tests/expiry_will_blackbox.py
      - run: python3 tests/negotiation_blackbox.py
      - run: python3 tests/subscription_blackbox.py
      - run: python3 tests/alias_blackbox.py
      - run: python3 tests/shared_blackbox.py
      - run: python3 tests/enhanced_auth_blackbox.py
      - run: python3 tests/conformance_blackbox.py
      - run: python3 tests/clause_boundaries_blackbox.py
      - run: python3 tests/semantic_boundaries_blackbox.py
      - run: python3 tests/rap_profiles_blackbox.py
      - run: python3 tests/fault_recovery_blackbox.py
      - run: python3 tests/ack_reuse_stress.py
      - run: python3 tests/phase3_reliability.py
      - run: python3 tests/phase3a_wakeup_blackbox.py
      - name: SQL rules and Webhook outbound acceptance
        run: python3 tests/rules_webhook_blackbox.py
      - name: Bounded outbound HTTP concurrency acceptance
        run: python3 tests/outbound_concurrency_blackbox.py
      - name: Per-client ordered outbound delivery
        run: python3 tests/outbound_client_order_blackbox.py
      - name: Durable segmented outbound recovery acceptance
        run: python3 tests/outbound_durable_blackbox.py
      - name: Shared rule-result streams and v1 migration acceptance
        run: python3 tests/rule_stream_blackbox.py
      - name: Independent live Dashboard management acceptance
        run: python3 tests/dashboard_blackbox.py
      - name: Copied executable embedded Dashboard acceptance
        run: python3 tests/dashboard_embedded.py
      - name: Independent HTTP authentication and topic authorization acceptance
        timeout-minutes: 5
        env:
          RUST_LOG: warn,lyrnormq=info
          LYRNORMQ_LOG_FORMAT: text
        run: python3 tests/http_access_blackbox.py -v
      - name: Client lifecycle system topics acceptance
        timeout-minutes: 5
        run: python3 tests/system_client_events_blackbox.py -v
      - name: Privileged HTTP downlink acceptance
        timeout-minutes: 5
        run: python3 tests/http_publish_blackbox.py -v
      - name: Embedded Raft cluster and live forwarding acceptance
        timeout-minutes: 15
        run: python3 tests/cluster_blackbox.py -v
      - name: Combined-role three-member loopback cluster and loadgen
        timeout-minutes: 10
        run: python3 tests/cluster_combined_blackbox.py -v
      # Phase7f replaces data-plane SQLite with volatile memory. Historical disk
      # replay suites remain as evidence, not claimed as supported RAM behavior.
      - name: Memory replicas, live-majority failover and in-process catch-up
        timeout-minutes: 15
        run: python3 tests/cluster_memory_blackbox.py -v
      - name: Cluster directory Dashboard management acceptance
        timeout-minutes: 10
        run: python3 tests/cluster_dashboard_blackbox.py -v
      - name: Event-driven forwarding retry and ownership acceptance
        timeout-minutes: 10
        run: python3 tests/cluster_event_blackbox.py -v
      - name: Incremental control and committed-tail recovery acceptance
        timeout-minutes: 5
        run: |
          python3 -m unittest discover -s tests -p cluster_control_optimization_limits_test.py -v
          python3 tests/cluster_control_optimization_blackbox.py -v
      - name: Independent Raft WAL and checkpoint crash recovery
        timeout-minutes: 10
        run: PYTHONPATH=tests python3 -m unittest cluster_raft_wal_blackbox.RaftWalAcceptance -v
      - name: Bbolt Controller layout and offline export acceptance
        timeout-minutes: 10
        run: |
          python3 tests/cluster_bbolt_export_test.py -v -f
          PYTHONPATH=tests python3 -m unittest cluster_bbolt_blackbox.BboltAcceptance -v -f
      - name: Controller observation sampler verification
        timeout-minutes: 5
        run: python3 -m unittest discover -s tests -p cluster_topology_controller_probe_test.py -v
      - run: python3 -m pip install paho-mqtt==2.1.0
      - run: python3 tests/websocket_paho.py
      - run: python3 tests/paho_interop.py
      - run: python3 tests/persistence_paho.py
      - run: python3 tests/retained_will_paho.py
      - run: python3 tests/auth_acl_paho.py
      - run: python3 tests/mqtt5_paho.py
      - run: python3 tests/expiry_will_paho.py
      - run: python3 tests/negotiation_paho.py
      - run: python3 tests/subscription_paho.py
      - run: python3 tests/alias_paho.py
      - run: python3 tests/shared_paho.py
      - name: Existing client suites with SQLite enabled
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, tempfile
          for suite in ('blackbox.py', 'qos_blackbox.py', 'paho_interop.py', 'retained_will_blackbox.py', 'retained_will_paho.py', 'auth_acl_blackbox.py', 'auth_acl_paho.py', 'mqtt5_blackbox.py', 'mqtt5_paho.py', 'expiry_will_blackbox.py', 'expiry_will_paho.py', 'negotiation_blackbox.py', 'negotiation_paho.py', 'subscription_blackbox.py', 'subscription_paho.py', 'alias_blackbox.py', 'alias_paho.py', 'shared_blackbox.py', 'shared_paho.py', 'enhanced_auth_blackbox.py', 'conformance_blackbox.py', 'clause_boundaries_blackbox.py', 'semantic_boundaries_blackbox.py', 'rap_profiles_blackbox.py', 'fault_recovery_blackbox.py', 'phase3_reliability.py', 'phase3a_wakeup_blackbox.py'):
              with tempfile.TemporaryDirectory(prefix='lyrnormq-sqlite-regression-') as directory:
                  env = dict(os.environ, LYRNORMQ_TEST_STORAGE_PATH=os.path.join(directory, 'sessions.sqlite'))
                  subprocess.run([sys.executable, 'tests/' + suite], env=env, check=True)
          PY

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-29
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo run --release --locked --manifest-path fuzz/Cargo.toml -- 20000 332593189941
      - name: Bounded coverage-guided codec and session campaigns
        env:
          ASAN_OPTIONS: quarantine_size_mb=64
        run: |
          mkdir -p /tmp/lyrnormq-fuzz-artifacts
          cp -R fuzz/corpus /tmp/lyrnormq-codec-corpus
          cp -R fuzz/corpus /tmp/lyrnormq-session-corpus
          cargo fuzz run --fuzz-dir fuzz/libfuzzer codec /tmp/lyrnormq-codec-corpus -- -max_total_time=30 -max_len=4096 -timeout=2 -rss_limit_mb=512 -seed=20261029 -artifact_prefix=/tmp/lyrnormq-fuzz-artifacts/codec-
          cargo fuzz run --fuzz-dir fuzz/libfuzzer session /tmp/lyrnormq-session-corpus -- -max_total_time=30 -max_len=4096 -timeout=2 -rss_limit_mb=512 -seed=20261030 -artifact_prefix=/tmp/lyrnormq-fuzz-artifacts/session-
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failure-inputs
          path: /tmp/lyrnormq-fuzz-artifacts/

  postgres-access:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build embedded Dashboard
        working-directory: dashboard/web
        run: npm ci && npm run build
      - name: Install cluster RPC code generator
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --locked -p mqtt-auth-postgres -- --include-ignored
      - run: cargo clippy --locked -p mqtt-auth-postgres -p mqtt-auth-http --all-targets -- -D warnings
      - run: cargo check --locked -p lyrnormq --no-default-features
      - run: cargo build --locked -p lyrnormq
      - name: PostgreSQL MQTT and management acceptance
        env:
          LYRNORMQ_BIN: ${{ github.workspace }}/target/debug/lyrnormq
        run: python3 tests/postgres_access_blackbox.py -v
