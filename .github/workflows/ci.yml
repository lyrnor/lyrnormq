name: Rust and MQTT checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      - run: python3 tests/check_conformance_matrix.py
      - run: python3 tests/blackbox.py
      - run: python3 tests/qos_blackbox.py
      - run: python3 tests/persistence_blackbox.py
      - run: python3 tests/retained_will_blackbox.py
      - run: python3 tests/auth_acl_blackbox.py
      - run: python3 tests/mqtt5_blackbox.py
      - run: python3 tests/expiry_will_blackbox.py
      - run: python3 tests/negotiation_blackbox.py
      - run: python3 tests/subscription_blackbox.py
      - run: python3 tests/alias_blackbox.py
      - run: python3 tests/shared_blackbox.py
      - run: python3 tests/enhanced_auth_blackbox.py
      - run: python3 tests/conformance_blackbox.py
      - run: python3 tests/clause_boundaries_blackbox.py
      - run: python3 tests/semantic_boundaries_blackbox.py
      - run: python3 tests/rap_profiles_blackbox.py
      - run: python3 -m pip install paho-mqtt==2.1.0
      - run: python3 tests/paho_interop.py
      - run: python3 tests/persistence_paho.py
      - run: python3 tests/retained_will_paho.py
      - run: python3 tests/auth_acl_paho.py
      - run: python3 tests/mqtt5_paho.py
      - run: python3 tests/expiry_will_paho.py
      - run: python3 tests/negotiation_paho.py
      - run: python3 tests/subscription_paho.py
      - run: python3 tests/alias_paho.py
      - run: python3 tests/shared_paho.py
      - name: Existing client suites with SQLite enabled
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, tempfile
          for suite in ('blackbox.py', 'qos_blackbox.py', 'paho_interop.py', 'retained_will_blackbox.py', 'retained_will_paho.py', 'auth_acl_blackbox.py', 'auth_acl_paho.py', 'mqtt5_blackbox.py', 'mqtt5_paho.py', 'expiry_will_blackbox.py', 'expiry_will_paho.py', 'negotiation_blackbox.py', 'negotiation_paho.py', 'subscription_blackbox.py', 'subscription_paho.py', 'alias_blackbox.py', 'alias_paho.py', 'shared_blackbox.py', 'shared_paho.py', 'enhanced_auth_blackbox.py', 'conformance_blackbox.py', 'clause_boundaries_blackbox.py', 'semantic_boundaries_blackbox.py', 'rap_profiles_blackbox.py'):
              with tempfile.TemporaryDirectory(prefix='rmqtt-sqlite-regression-') as directory:
                  env = dict(os.environ, RMQTT_TEST_STORAGE_PATH=os.path.join(directory, 'sessions.sqlite'))
                  subprocess.run([sys.executable, 'tests/' + suite], env=env, check=True)
          PY
